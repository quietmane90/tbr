<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Kindle Link Test</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F6F4EF;--fg:#16181D;--muted:#5E636E;--line:#E2DED5;--card:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1117;--fg:#F1F2F5;--muted:#9AA0AB;--line:#262B36;--card:#171B24}}
:root[data-theme="dark"]{--bg:#0E1117;--fg:#F1F2F5;--muted:#9AA0AB;--line:#262B36;--card:#171B24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:clip}
main{max-width:460px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:12px}
h1{font-size:1.3rem;margin:0}
p{margin:0;color:var(--muted);font-size:.92rem}
a{display:grid;gap:2px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none}
a b{font-size:1.05rem}
a span{font-size:.72rem;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>Which one opens the book?</h1>
  <p id="sub"></p>
  <div id="list" style="display:grid;gap:10px"></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),a=(q.get('asin')||'B08J7LQ6Z5').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  document.getElementById('sub').textContent='Book ID '+a+'. Tap each one, come back here, and note the letters that open the book itself.';
  var v=[
    ['A','kindle://book?action=open&asin='+a],
    ['B','kindle://book?action=open&asin='+a+'&location=1'],
    ['C','kindle://book/?action=open&asin='+a],
    ['D','kindle://open?asin='+a],
    ['E','kindle://book?asin='+a],
    ['F','https://read.amazon.com/kp/kshare?asin='+a],
    ['G','https://read.amazon.com/kp/embed?asin='+a]
  ];
  var L=document.getElementById('list');
  v.forEach(function(x){var el=document.createElement('a');el.href=x[1];el.innerHTML='<b>'+x[0]+'</b><span></span>';el.querySelector('span').textContent=x[1];L.appendChild(el);});
})();
</script>
</body>
</html>
